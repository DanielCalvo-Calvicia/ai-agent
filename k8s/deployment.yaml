apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${PROJECTNAME}
  namespace: ${K8S_NAMESPACE}
  labels:
    app: ${PROJECTNAME}
    version: v1
spec:
  # One replica: the sessions (the history of each conversation and the runs paused to ask the
  # user a question) are in the memory of the process (SessionService.sessions), so a second
  # replica would not know the sessions of the first and answer SESSION_NOT_FOUND for them.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ${PROJECTNAME}
  template:
    metadata:
      labels:
        app: ${PROJECTNAME}
        version: v1
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: ${PROJECTNAME}
          image: ${IMAGE}
          imagePullPolicy: Always

          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          ports:
            - name: http
              containerPort: ${PORT}
              protocol: TCP

          # Every env var the service reads (HTTP_ADDR, APP_ENV, AI_AGENT_RELOAD,
          # the provider keys, DYNAMICS_MCP_URL, the AI_AGENT_* settings, ...) comes from the Secret
          # below, upserted from GitHub Variables/Secrets by the deploy step: never declared
          # directly in this manifest.
          envFrom:
            - secretRef:
                name: ${PROJECTNAME}-secrets

          # The root filesystem is read-only: the libraries that need a scratch directory use /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          # ai-agent has one health route, GET /health (it answers once the profiles are loaded;
          # it never calls an LLM). There is no /ready, so both probes use it.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              memory: ${MEM_REQUEST}
              cpu: ${CPU_REQUEST}
            limits:
              memory: ${MEM_LIMIT}
              cpu: ${CPU_LIMIT}

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
