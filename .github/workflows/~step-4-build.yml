# ==============================================================================
# STEP 4 - Build & Push
# ==============================================================================
# Builds the production Docker image and pushes it to GitHub Container Registry.
# Tags the image with both :latest and the short git SHA for immutable deploys.
#
# Called by: ~flow-deploy.yml (workflow_call only — never runs on its own)
# Outputs:   image_sha  (short SHA consumed by Step 5 and Step 6)
# ==============================================================================

name: Step 4 - Build & Push

on:
  workflow_call:
    outputs:
      image_sha:
        description: "The short SHA of the pushed docker image"
        value: ${{ jobs.build.outputs.image_sha }}

jobs:
  build:
    name: "🐳 Build & Push to GHCR"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # GITHUB_TOKEN needs these scopes to:
    #   contents: read   — checkout
    #   packages: write  — push the image layers/manifest to ghcr.io
    # Without 'packages: write' the push fails at the blob HEAD step with 403.
    permissions:
      contents: read
      packages: write

    outputs:
      image_sha: ${{ steps.meta.outputs.sha }}

    steps:
      # --------------------------------------------------------------------------
      # 1. Source
      # --------------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------------------------
      # 2. Docker setup
      # --------------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------------------------
      # 3. Resolve image tags
      # --------------------------------------------------------------------------
      - name: Resolve short SHA
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------------------
      # 4. Build (production stage) and push
      #    BuildKit GHA cache reuses unchanged layers across runs (the
      #    dependency layer only changes when requirements.txt or vendor/ do).
      #    PYTHON_VERSION falls back to the Dockerfile's default: an empty
      #    build-arg would override that default with an empty string.
      # --------------------------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:latest
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PYTHON_VERSION=${{ vars.PYTHON_VERSION || '3.14' }}
