# ==============================================================================
# STEP 1 - Secret Scanning
# ==============================================================================
# Scans the full git history for leaked credentials, API keys, tokens, and
# other sensitive data using TruffleHog OSS.
#
# Called by: ~flow-verify.yml (workflow_call only — never runs on its own)
# ==============================================================================

name: Step 1 - Secret Scanning

on:
  workflow_call:

jobs:
  secrets:
    name: "🔐 Scan for Leaked Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # --------------------------------------------------------------------------
      # 1. Source — full history needed for git diff scanning
      # --------------------------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------------------------
      # 2. TruffleHog OSS: scan all git history for secrets
      # --------------------------------------------------------------------------
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
